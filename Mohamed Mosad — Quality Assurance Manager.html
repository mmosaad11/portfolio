<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Mosad — Quality Assurance Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B0D;--bg2:#0E1215;--card:#12181B;--line:#1F2A2D;--teal:#0D6E6E;--teal2:#19B5A8;--tx:#EEF2F0;--mut:#9AA8A6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#090B0D}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(9,11,13,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand b{display:block;letter-spacing:.14em;font-size:14px}.brand span{font-size:10px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
nav ul{display:flex;gap:4px;list-style:none;padding:0}
nav a{display:block;padding:8px 13px;border-radius:8px;font-size:14px;color:#cfd8d6;transition:.25s}
nav a:hover{color:#fff;background:rgba(13,110,110,.15)}
nav a.on{color:var(--teal2);background:rgba(13,110,110,.22)}
#burger{display:none;background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;width:42px;height:42px;font-size:20px;cursor:pointer}
@media(max-width:980px){#burger{display:block}nav{position:absolute;left:0;right:0;top:72px;background:var(--bg2);border-bottom:1px solid var(--line);display:none}nav.open{display:block}nav ul{flex-direction:column;padding:12px 24px}}
main{min-height:70vh;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec{padding:72px 0}
.sh{margin-bottom:40px}.sh small{color:var(--teal2);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:600}
.sh h2{font-size:clamp(28px,4vw,40px);font-weight:700;margin-top:6px;letter-spacing:-.01em}
.sh i{display:block;width:48px;height:2px;background:var(--teal);margin-top:14px}
.hero{background:radial-gradient(60% 80% at 75% 40%,rgba(13,110,110,.28),transparent 70%),var(--bg);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:end;min-height:600px}
.hero .txt{padding:64px 0;align-self:center}
h1{font-size:clamp(40px,6.2vw,72px);font-weight:800;letter-spacing:.02em;line-height:1.05}
.role{color:var(--teal2);font-size:clamp(20px,2.4vw,28px);font-weight:600;margin:14px 0 22px}
.hero p{color:#c3cecb;max-width:560px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid var(--teal);transition:.25s;cursor:pointer;color:var(--tx);background:none}
.btn.p{background:var(--teal)}.btn:hover{transform:translateY(-2px);border-color:var(--teal2)}.btn.p:hover{background:#0f8080}
.ph{position:relative;display:flex;justify-content:center}
.ph img{width:100%;max-width:470px;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.ph:before{content:"";position:absolute;left:12%;right:12%;top:8%;bottom:0;border:1px solid rgba(25,181,168,.35);border-bottom:0;border-radius:40% 40% 0 0/22% 22% 0 0}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr;min-height:0}.hero .txt{padding:44px 0 0}.ph img{max-width:340px}}
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;transition:.3s}
.card:hover{border-color:var(--teal);transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ic{width:46px;height:46px;border:1px solid var(--teal);border-radius:12px;display:grid;place-items:center;color:var(--teal2);margin-bottom:16px}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h3{font-size:19px;font-weight:600;line-height:1.3}.mut{color:var(--mut)}.sm{font-size:14px}
.strip{background:var(--bg2);border-bottom:1px solid var(--line)}
.strip .card{background:none;border:0;text-align:center}.strip .ic{margin:0 auto 14px}
.strip .card:hover{transform:none;box-shadow:none}
ul.b{list-style:none;padding:0;margin-top:14px}ul.b li{position:relative;padding-left:20px;margin:8px 0;color:#c3cecb;font-size:15px}
ul.b li:before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--teal2)}
.tag{display:inline-block;border:1px solid var(--line);background:rgba(13,110,110,.12);color:#d7e3e0;padding:5px 12px;border-radius:999px;font-size:13px;margin:4px 6px 0 0}
.tl{position:relative;padding-left:34px}.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .card{margin-bottom:26px;position:relative}.tl .card:before{content:"";position:absolute;left:-34px;top:30px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--teal2)}
.tl .cur:before{background:var(--teal2);box-shadow:0 0 0 5px rgba(25,181,168,.18)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 4px;font-size:14px;color:var(--mut)}
.badge{background:var(--teal);color:#fff;font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:999px;text-transform:uppercase;font-weight:600;margin-left:8px;vertical-align:middle}
.lbl{color:var(--teal2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:18px}
.cc{display:flex;gap:16px;align-items:center}.cc .ic{margin:0;flex:none}
.cert .pv{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);margin-bottom:16px;overflow:hidden;background:#0a0f11;cursor:zoom-in;padding:8px}
.cert .pv img{width:100%;height:100%;object-fit:contain;border-radius:4px;transition:.3s}.cert:hover .pv img{transform:scale(1.02)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:calc(100% - 44px);object-fit:contain;border-radius:8px;cursor:default}#lb p{color:var(--mut);font-size:14px;margin-top:12px;text-align:center}#lbx{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:32px 0;margin-top:40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
footer a:hover{color:var(--teal2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<section class="strip"><div class="wrap grid g4" style="padding-top:40px;padding-bottom:40px">${[["shield","Food Safety","BRCGS · HACCP · ISO 22000"],["gear","Quality Management","Policies, procedures and systems"],["team","Team Leadership","Leading the QA team"],["up","Continuous Improvement","CAPA and KPI monitoring"]].map(x=>`<div class="card">${ic(x[0])}<h3>${x[1]}</h3><p class="mut sm">${x[2]}</p></div>`).join('')}</div></section>`,
about:()=>`<section class="sec"><div class="wrap">${SH("About","Professional Profile")}<div class="grid g2"><div class="card"><h3>Professional summary</h3><p class="mut" style="margin-top:12px">${SUM}</p></div><div class="card"><h3>Career profile</h3>${li(["Quality Assurance Manager at "+CO+", 2025 to present.","Previously QA & QC Engineer at the same company, 2023–2024.","Bachelor's degree in Agricultural Engineering, Al-Azhar University.","Arabic (native) and English (very good)."])}</div></div>
<div class="sh" style="margin-top:56px"><small>Expertise</small><h2>Key Strengths</h2><i></i></div><div class="grid g3">${[["shield","Food Safety Systems","BRCGS, HACCP, ISO 22000 and FSSC 22000 knowledge."],["aw","Certification & Audits","Managing certification, regulatory and customer audits."],["team","Team Leadership","Leading and supervising QA staff."],["up","Continuous Improvement","Driving better food safety systems, product quality and operational performance."],["doc","Documentation & Reporting","Strong reporting and documentation skills."],["gear","Problem Solving","Root cause analysis and corrective & preventive actions."]].map(x=>`<div class="card">${ic(x[0])}<h3>${x[1]}</h3><p class="mut sm" style="margin-top:6px">${x[2]}</p></div>`).join('')}</div></div></section>`,
experience:()=>`<section class="sec"><div class="wrap">${SH("Career","Experience")}<div class="tl">${JOBS.map(jobCard).join('')}</div><p class="mut sm">${CO} — a leading company in poultry production, focused on quality and safety standards.</p></div></section>`,
projects:()=>`<section class="sec"><div class="wrap">${SH("Work","Projects & Achievements")}<div class="grid g3">${PROJ.map(p=>`<div class="card">${ic("aw")}<h3>${p.t}</h3>${p.role?`<div class="lbl">Role</div><p class="sm">${p.role}</p>`:''}${p.act?`<div class="lbl">Key activities</div>${li(p.act)}`:''}<div class="lbl">Result</div><p class="sm" style="color:#c3cecb">${p.res}</p><div style="margin-top:16px">${p.s.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>`).join('')}</div></div></section>`,
skills:()=>`<section class="sec"><div class="wrap">${SH("Expertise","Skills")}<div class="grid g2">${SK.map(k=>`<div class="card">${ic(k[1])}<h3>${k[0]}</h3><div style="margin-top:14px">${k[2].map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>`).join('')}</div></div></section>`,
certifications:()=>`<section class="sec"><div class="wrap">${SH("Training","Certifications & Courses")}<div class="grid g3">${CERT.map((c,i)=>`<div class="card cert"><div class="pv" data-i="${i}" title="Click to enlarge"><img src="${c.img}" alt="${c.t} certificate"></div><h3>${c.t}</h3><div class="meta"><span>${c.o}</span><span>${c.dt}</span></div>${c.d?`<p class="mut sm">${c.d}</p>`:''}</div>`).join('')}</div><div class="sh" style="margin-top:56px"><small>Also completed</small><h2>Additional Courses</h2><i></i></div><div class="grid g2">${OTHER.map(o=>`<div class="card cc">${ic("aw")}<div><h3>${o[0]}</h3><p class="mut sm" style="margin-top:6px">${o[1]}</p></div></div>`).join('')}</div></div></section>`,
education:()=>`<section class="sec"><div class="wrap">${SH("Academic","Education")}<div class="card cc" style="max-width:720px">${ic("cap")}<div><h3>Bachelor's degree in Agricultural Engineering</h3><p class="mut" style="margin-top:6px">Al-Azhar University</p><div class="meta"><span>2016 – 2020</span><span>Grade: Very Good</span></div></div></div></div></section>`,
contact:()=>`<section class="sec"><div class="wrap">${SH("Contact","Get in Touch")}<div class="grid g3">${[["ph","Phone",PH,"tel:"+PH],["mail","Email",EMAIL,GM],["in","LinkedIn","linkedin.com/in/mohamed-mosaad-172046241",LI]].map(c=>`<a class="card" href="${c[3]}" ${c[0]!='ph'?'target="_blank" rel="noopener"':''}>${ic(c[0])}<h3>${c[1]}</h3><p class="mut sm" style="margin-top:6px;word-break:break-all">${c[2]}</p></a>`).join('')}</div><div class="btns"><button class="btn" data-copy="${EMAIL}">Copy email address</button><button class="btn" data-copy="${PH}">Copy phone number</button></div></div></section>`};
const NAV=[["","Home"],["about","About"],["experience","Experience"],["projects","Projects"],["skills","Skills"],["certifications","Certifications"],["education","Education"],["contact","Contact"]];
const app=document.getElementById("app"),nav=document.getElementById("nav");
document.getElementById("links").innerHTML=NAV.map(n=>`<li><a href="#/${n[0]}" data-r="${n[0]}">${n[1]}</a></li>`).join('');
function route(){const r=(location.hash.replace(/^#\/?/,'')||'');const k=P[r]?r:'';app.innerHTML=P[k]();app.style.animation='none';app.offsetHeight;app.style.animation='';
document.querySelectorAll("#links a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));nav.classList.remove("open");scrollTo(0,0)}
addEventListener("hashchange",route);route();
document.getElementById("burger").onclick=()=>nav.classList.toggle("open");
const lb=document.getElementById("lb"),shut=()=>lb.classList.remove("on");
app.addEventListener("click",e=>{const p=e.target.closest(".pv");if(p){const c=CERT[p.dataset.i],im=lb.querySelector("img");im.src=c.img;im.alt=c.t;lb.querySelector("p").textContent=c.t;lb.classList.add("on")}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;const v=b.dataset.copy,o=b.textContent;const ok=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent=o,1800)};
try{navigator.clipboard.writeText(v).then(ok,fb)}catch(_){fb()}
function fb(){const x=document.createElement("textarea");x.value=v;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(_){}x.remove();ok()}});
lb.onclick=e=>{if(e.target!==lb.querySelector("img"))shut()};addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
</script></body></html>
